name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar estrutura e compilar APK
        run: |
          mkdir -p www

          # Procura qualquer ficheiro no repositório que contenha o código HTML do jogo
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ ! -f "www/index.html" ]; then
            FOUND_HTML=$(grep -rl -i "<!DOCTYPE html>" . --exclude-dir={.git,.github,node_modules,android,www} | head -n 1 || true)
            if [ -n "$FOUND_HTML" ]; then
              echo "Ficheiro HTML encontrado em: $FOUND_HTML"
              cp "$FOUND_HTML" www/index.html
            else
              echo "=================================================================="
              echo "ERRO: O ficheiro index.html com o código do jogo não está no repositório!"
              echo "Vá ao separador '<> Code' -> 'Add file' -> 'Create new file',"
              echo "dê o nome 'index.html', cole o código do jogo e faça Commit."
              echo "=================================================================="
              exit 1
            fi
          fi

          # Limpar ficheiros temporários e criar package.json válido
          rm -rf node_modules package.json package-lock.json android capacitor.config.json capacitor.config.ts
          cat << 'EOF' > package.json
          {
            "name": "tetrio-mobile-app",
            "version": "1.0.0",
            "private": true
          }
          EOF

          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.tetrio.mobile",
            "appName": "TETRIO Mobile",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add android
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: TETRIO-Mobile-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
