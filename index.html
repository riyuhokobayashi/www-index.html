<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TETR.IO Mobile - Nível 25</title>
  <style>
    :root {
      --bg: #090b10;
      --panel: #121722;
      --border: #263147;
      --accent: #00f0ff;
      --text: #eef2ff;
      --muted: #7c8ba1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at center, #131926 0%, #07090e 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 6px) 6px env(safe-area-inset-bottom, 8px);
    }

    /* TOPO E MÚSICAS */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      flex-shrink: 0;
    }
    .brand {
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--accent);
      text-shadow: 0 0 8px rgba(0,240,255,0.4);
    }
    .music-bar {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .btn-sm {
      background: #1b2234;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-sm.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* ÁREA DO JOGO */
    .game-area {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 6px;
      flex: 1;
      min-height: 0;
      padding: 4px 0;
    }
    .side-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 68px;
      flex-shrink: 0;
    }
    .box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      text-align: center;
    }
    .box-title {
      font-size: 9px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 1px;
      margin-bottom: 3px;
    }
    .stat-val {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }
    .stat-val.accent {
      color: var(--accent);
    }
    .board-wrap {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#board {
      background: #06080d;
      border: 2px solid #2e3c56;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      max-height: 100%;
      width: auto;
    }
    .action-banner {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      text-align: center;
      font-weight: 900;
      font-size: 15px;
      color: #ffea00;
      text-shadow: 0 2px 8px #000;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    /* CONTROLOS NO ECRÃ */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      padding-bottom: 2px;
    }
    .ctrl-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
